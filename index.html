function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      items = data.items || [];
      nextId = data.nextId || 94;
      activeCat = data.activeCat || 'today';
      filterProj = data.filterProj || 'all';
      filterPri = data.filterPri || 'all';
      PROJS = Object.assign({}, BASE_PROJS, data.customProjs || {});
      PROJ_ORDER = Object.keys(PROJS);
      remindEnabled = !!data.remindEnabled;
      remindTime = data.remindTime || '21:00';
      lastRemindDate = data.lastRemindDate || '';
      return;
    }
  } catch(e) {}
  items = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
}

function customProjs() {
  const c = {};
  Object.keys(PROJS).forEach(k => { if (!BASE_PROJS[k]) c[k] = PROJS[k]; });
  return c;
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      items, nextId, activeCat, filterProj, filterPri,
      customProjs: customProjs(), remindEnabled, remindTime, lastRemindDate
    }));
    const ind = document.getElementById('saveInd');
    if (ind) { ind.classList.add('show'); clearTimeout(saveTimer); saveTimer = setTimeout(() => ind.classList.remove('show'), 1500); }
  } catch(e) {}
}

function projLabel(p) { return PROJS[p] || 'Other'; }
function isCustomProj(p) { return !BASE_PROJS[p]; }

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function isISODate(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s || ''); }
function dlState(dl) {
  if (!isISODate(dl)) return '';
  if (dl < todayStr()) return 'overdue';
  if (dl === todayStr()) return 'duetoday';
  return '';
}
function fmtDl(dl) {
  if (!dl) return '';
  if (!isISODate(dl)) return dl;
  const d = new Date(dl + 'T00:00:00');
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return days[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1);
}

function projOptions(current) {
  let s = '';
  PROJ_ORDER.forEach(k => { s += '<option value="' + k + '"' + (k === current ? ' selected' : '') + '>' + esc(PROJS[k]) + '</option>'; });
  s += '<option value="__new__">+ New project...</option>';
  return s;
}

function handleProjChange(id, sel) {
  if (sel.value === '__new__') {
    const name = prompt('New project / person name:');
    if (name && name.trim()) {
      const key = 'custom_' + Date.now();
      PROJS[key] = name.trim();
      PROJ_ORDER.push(key);
      if (id === 'new') { save(); render(); const s2 = document.getElementById('newProj'); if (s2) s2.value = key; return; }
      const it = items.find(i => i.id === id);
      if (it) it.proj = key;
      save(); render(); return;
    }
    save(); render(); return;
  }
  if (id === 'new') return;
  const it = items.find(i => i.id === id);
  if (it) { it.proj = sel.value; save(); render(); }
}

function stageSelect(id, current) {
  let s = '<select class="stage-select" onchange="moveCat(' + id + ',this.value)" onclick="event.stopPropagation()" title="Move to stage">';
  CATS.forEach(c => { s += '<option value="' + c.id + '"' + (c.id === current ? ' selected' : '') + '>' + c.label + '</option>'; });
  return s + '</select>';
}

function filteredList() {
  let list = items.filter(i => i.cat === activeCat);
  if (filterProj !== 'all') list = list.filter(i => i.proj === filterProj);
  if (filterPri !== 'all') list = list.filter(i => i.pri === filterPri);
  if (searchQ) {
    const q = searchQ.toLowerCase();
    list = list.filter(i => i.txt.toLowerCase().includes(q) || projLabel(i.proj).toLowerCase().includes(q));
  }
  return list;
}

function render() {
  const app = document.getElementById('app');
  const doneCount = items.filter(i => i.cat === 'done').length;
  const pct = items.length ? Math.round(doneCount / items.length * 100) : 0;
  const overdue = items.filter(i => i.cat !== 'done' && dlState(i.dl) === 'overdue').length;
  const dueToday = items.filter(i => i.cat !== 'done' && dlState(i.dl) === 'duetoday').length;

  let html = '<div class="topbar">';
  html += '<button class="undo-btn' + (lastDeleted ? ' show' : '') + '" onclick="undoDelete()">' + UNDO_SVG + ' Undo delete</button>';
  html += '<button class="top-btn' + (selectMode ? ' active' : '') + '" onclick="toggleSelectMode()">' + SELECT_SVG + ' Select</button>';
  html += '<span class="save-indicator" id="saveInd">' + SAVE_SVG + ' Saved</span>';
  html += '</div>';

  html += '<div class="progress"><span class="progress-label">' + doneCount + ' of ' + items.length + ' done</span><div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div><span class="progress-label">' + pct + '%</span></div>';

  if (overdue > 0) html += '<div class="alert-banner">' + WARN_SVG + ' ' + overdue + ' overdue task' + (overdue > 1 ? 's' : '') + ' past their due date.</div>';
  else if (dueToday > 0) html += '<div class="alert-banner today">' + WARN_SVG + ' ' + dueToday + ' task' + (dueToday > 1 ? 's' : '') + ' due today.</div>';

  html += '<div class="tabs">';
  CATS.forEach(c => {
    const n = items.filter(i => i.cat === c.id).length;
    html += '<button class="tab' + (activeCat === c.id ? ' active' : '') + '" onclick="setCat(\'' + c.id + '\')">' + c.label + ' <span class="count">' + n + '</span></button>';
  });
  html += '</div>';

  html += '<div class="filter-row"><input class="search-input" placeholder="Search tasks..." value="' + escAttr(searchQ) + '" oninput="setSearch(this.value)"><select onchange="setFilterProj(this.value)"><option value="all">All projects</option>' + PROJ_ORDER.map(k => '<option value="' + k + '"' + (k === filterProj ? ' selected' : '') + '>' + esc(PROJS[k]) + '</option>').join('') + '</select><select onchange="setFilterPri(this.value)"><option value="all">All priorities</option><option value="p1"' + (filterPri === 'p1' ? ' selected' : '') + '>P1 only</option><option value="p2"' + (filterPri === 'p2' ? ' selected' : '') + '>P2 only</option><option value="p3"' + (filterPri === 'p3' ? ' selected' : '') + '>P3 only</option></select></div>';

  const list = filteredList();

  if (selectMode) {
    const selCount = Object.keys(selected).filter(k => selected[k]).length;
    html += '<div class="bulk-bar"><span>' + selCount + ' selected</span>';
    html += '<select id="bulkMove"><option value="">Move to...</option>' + CATS.map(c => '<option value="' + c.id + '">' + c.label + '</option>').join('') + '</select>';
    html += '<button onclick="bulkMove()">Apply</button>';
    html += '<button class="danger" onclick="bulkDelete()">Delete selected</button>';
    html += '<button onclick="selectAllVisible()">Select all shown</button>';
    html += '</div>';
  }

  html += '<div class="list">';
  if (!list.length) html += '<div class="empty">Nothing here. Add something below.</div>';
  list.forEach(item => {
    const isDone = item.cat === 'done';
    const catIdx = CATS.findIndex(c => c.id === activeCat);
    const prevCat = catIdx > 0 ? CATS[catIdx - 1] : null;
    const nextCat = catIdx < CATS.length - 1 ? CATS[catIdx + 1] : null;
    const dls = dlState(item.dl);
    html += '<div class="item' + (isDone ? ' done' : '') + (selected[item.id] ? ' selected' : '') + '" data-id="' + item.id + '" draggable="' + (!selectMode) + '" ondragstart="onDragStart(event,' + item.id + ')" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event,' + item.id + ')" ondragend="onDragEnd(event)">';
    if (selectMode) {
      html += '<button class="sel-box' + (selected[item.id] ? ' on' : '') + '" onclick="toggleSelect(' + item.id + ')">' + CHECK_SVG + '</button>';
    } else {
      html += '<button class="check' + (isDone ? ' on' : '') + '" onclick="toggleDone(' + item.id + ')">' + CHECK_SVG + '</button>';
    }
    html += '<div class="body">';
    html += '<div class="txt">' + esc(item.txt) + '</div>';
    html += '<div class="meta">';
    html += '<button class="pri-btn ' + item.pri + '" onclick="cyclePri(' + item.id + ')" title="Tap to change priority">' + PRI[item.pri] + ' ▾</button>';
    html += '<span class="tag ' + (isCustomProj(item.proj) ? 'custom' : item.proj) + '">' + esc(projLabel(item.proj)) + '</span>';
    if (item.dl) html += '<span class="tag deadline ' + dls + '">' + esc(fmtDl(item.dl)) + (dls === 'overdue' ? ' — overdue' : dls === 'duetoday' ? ' — today' : '') + '</span>';

    if (item.dl) html += '<button class="icon-btn" style="width:24px;height:24px;font-size:14px" onclick="clearDl(' + item.id + ')" title="Clear due date">&times;</button>';
    html += '</div>';
    if (editingId === item.id) {
      html += '<div class="edit-row"><input id="edit-' + item.id + '" value="' + escAttr(item.txt) + '" onkeydown="if(event.key===\'Enter\')saveEdit(' + item.id + ')"><button class="add-btn" style="padding:6px 12px" onclick="saveEdit(' + item.id + ')">Save</button></div>';
    }
    html += '</div>';
    html += '<div class="actions">';
    if (!selectMode) {
      html += '<span class="drag-handle" title="Drag to reorder" ontouchstart="onHandleTouchStart(event,' + item.id + ')">' + GRIP_SVG + '</span>';
      if (prevCat) html += '<button class="icon-btn" onclick="moveCat(' + item.id + ',\'' + prevCat.id + '\')" title="' + prevCat.label + '">' + LEFT_SVG + '</button>';
      html += stageSelect(item.id, activeCat);
      if (nextCat) html += '<button class="icon-btn" onclick="moveCat(' + item.id + ',\'' + nextCat.id + '\')" title="' + nextCat.label + '">' + RIGHT_SVG + '</button>';
      html += '<button class="icon-btn" onclick="startEdit(' + item.id + ')">' + EDIT_SVG + '</button>';
      html += '<button class="icon-btn danger" onclick="delItem(' + item.id + ')">' + DEL_SVG + '</button>';
    }
    html += '</div></div>';
  });
  html += '</div>';

  html += '<div class="add-row"><input type="text" id="newItem" placeholder="Add a new task..." onkeydown="if(event.key===\'Enter\')addItem()"><select id="newPri"><option value="p1">P1</option><option value="p2" selected>P2</option><option value="p3">P3</option></select><select id="newProj" onchange="handleProjChange(\'new\',this)">' + projOptions('studios') + '</select><input type="date" id="newDl" title="Due date (optional)"><button class="add-btn" onclick="addItem()">' + ADD_SVG + '</button><button class="mic-btn' + (recording ? ' recording' : '') + '" onclick="toggleMic()" title="Voice input">' + MIC_SVG + '</button></div>';
  html += '<div class="mic-status' + ((recording || micStatus) ? ' show' : '') + (micError ? ' error' : '') + '">' + (recording ? 'Listening... speak now. Tap mic again to stop.' : esc(micStatus)) + '</div>';

  html += '<div class="reminder-row">' + BELL_SVG + '<span>Nightly reminder</span><input type="time" value="' + remindTime + '" onchange="setRemindTime(this.value)"><button onclick="toggleReminder()">' + (remindEnabled ? 'On — tap to turn off' : 'Turn on') + '</button><span class="reminder-note">Sends a browser notification at this time each day with your overdue &amp; due-today count. Works while this tab is open; on open it catches up if the time has passed.</span></div>';

  html += '<div class="export-row"><button class="export-btn" onclick="exportData()">' + DL_SVG + ' Export backup</button><button class="export-btn" onclick="document.getElementById(\'importFile\').click()">' + UP_SVG + ' Import backup</button><button class="export-btn danger" onclick="clearCompleted()">Clear completed</button></div>';

  app.innerHTML = html;
  if (editingId) { const inp = document.getElementById('edit-' + editingId); if (inp) inp.focus(); }
}

function esc(s) { const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }
function escAttr(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

function setCat(c) { activeCat = c; editingId = null; selected = {}; save(); render(); }
function setFilterProj(v) { filterProj = v; save(); render(); }
function setFilterPri(v) { filterPri = v; save(); render(); }
function setSearch(v) { searchQ = v; render(); const inp = document.querySelector('.search-input'); if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } }

function toggleDone(id) { const it = items.find(i => i.id === id); if (it) { it.cat = it.cat === 'done' ? 'today' : 'done'; save(); render(); } }
function moveCat(id, cat) { const it = items.find(i => i.id === id); if (it) { it.cat = cat; save(); render(); } }
function cyclePri(id) { const it = items.find(i => i.id === id); if (it) { const idx = PRI_ORDER.indexOf(it.pri); it.pri = PRI_ORDER[(idx + 1) % 3]; save(); render(); } }
function setDl(id, val) { const it = items.find(i => i.id === id); if (it) { if (val) it.dl = val; else delete it.dl; save(); render(); } }
function clearDl(id) { const it = items.find(i => i.id === id); if (it) { delete it.dl; save(); render(); } }
function startEdit(id) { editingId = id; render(); }
function saveEdit(id) { const inp = document.getElementById('edit-' + id); const it = items.find(i => i.id === id); if (inp && it && inp.value.trim()) it.txt = inp.value.trim(); editingId = null; save(); render(); }
function delItem(id) {
  const idx = items.findIndex(i => i.id === id);
  if (idx > -1) { lastDeleted = { item: items[idx], index: idx }; items.splice(idx, 1); save(); render(); }
}
function undoDelete() {
  if (lastDeleted) { items.splice(Math.min(lastDeleted.index, items.length), 0, lastDeleted.item); lastDeleted = null; save(); render(); }
}
function clearCompleted() {
  const n = items.filter(i => i.cat === 'done').length;
  if (n === 0) return;
  if (confirm('Clear ' + n + ' completed tasks? This cannot be undone.')) { items = items.filter(i => i.cat !== 'done'); save(); render(); }
}
function addItem() {
  const inp = document.getElementById('newItem');
  const v = inp.value.trim();
  if (!v) return;
  const projSel = document.getElementById('newProj');
  const proj = projSel.value === '__new__' ? 'studios' : projSel.value;
  const dlVal = document.getElementById('newDl').value;
  const it = { id: nextId++, cat: activeCat === 'done' ? 'today' : activeCat, txt: v, pri: document.getElementById('newPri').value, proj: proj };
  if (dlVal) it.dl = dlVal;
  items.unshift(it);
  micStatus = ''; micError = false;
  save(); render();
}

/* ---- Multi-select ---- */
function toggleSelectMode() { selectMode = !selectMode; selected = {}; render(); }
function toggleSelect(id) { selected[id] = !selected[id]; render(); }
function selectAllVisible() { filteredList().forEach(i => selected[i.id] = true); render(); }
function bulkMove() {
  const sel = document.getElementById('bulkMove');
  if (!sel || !sel.value) return;
  items.forEach(i => { if (selected[i.id]) i.cat = sel.value; });
  selected = {}; save(); render();
}
function bulkDelete() {
  const ids = Object.keys(selected).filter(k => selected[k]);
  if (!ids.length) return;
  if (!confirm('Delete ' + ids.length + ' selected tasks? This cannot be undone.')) return;
  items = items.filter(i => !selected[i.id]);
  selected = {}; save(); render();
}

/* ---- Drag & drop reorder ---- */
function onDragStart(e, id) {
  dragId = id;
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.classList.add('dragging');
}
function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
}
function onDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
function onDrop(e, targetId) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (dragId === null || dragId === targetId) return;
  const from = items.findIndex(i => i.id === dragId);
  const to = items.findIndex(i => i.id === targetId);
  if (from === -1 || to === -1) return;
  const moved = items.splice(from, 1)[0];
  items.splice(to, 0, moved);
  dragId = null;
  save(); render();
}
function onDragEnd(e) {
  dragId = null;
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
}

/* ---- Touch drag reorder (mobile) ---- */
let touchDragId = null;
let touchTargetId = null;
function onHandleTouchStart(e, id) {
  if (selectMode) return;
  touchDragId = id;
  touchTargetId = null;
  const itemEl = e.target.closest('.item');
  if (itemEl) itemEl.classList.add('dragging');
  e.preventDefault();
}
document.addEventListener('touchmove', function(e) {
  if (touchDragId === null) return;
  e.preventDefault();
  const t = e.touches[0];
  const el = document.elementFromPoint(t.clientX, t.clientY);
  document.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over'));
  const itemEl = el ? el.closest('.item') : null;
  if (itemEl && Number(itemEl.dataset.id) !== touchDragId) {
    touchTargetId = Number(itemEl.dataset.id);
    itemEl.classList.add('drag-over');
  } else {
    touchTargetId = null;
  }
}, { passive: false });
document.addEventListener('touchend', function() {
  if (touchDragId === null) return;
  document.querySelectorAll('.dragging,.drag-over').forEach(x => x.classList.remove('dragging', 'drag-over'));
  if (touchTargetId !== null && touchTargetId !== touchDragId) {
    const from = items.findIndex(i => i.id === touchDragId);
    const to = items.findIndex(i => i.id === touchTargetId);
    if (from > -1 && to > -1) {
      const moved = items.splice(from, 1)[0];
      items.splice(to, 0, moved);
      save();
    }
  }
  touchDragId = null;
  touchTargetId = null;
  render();
});

/* ---- Voice input (Web Speech API) ---- */
function setMicStatus(msg, isErr) { micStatus = msg; micError = !!isErr; }
function toggleMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    setMicStatus('Voice input is not supported in this browser. Use Chrome or Edge (and on Android, Chrome).', true);
    render(); return;
  }
  if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.protocol !== 'file:') {
    setMicStatus('Voice input needs a secure (HTTPS) connection to access the microphone.', true);
    render(); return;
  }
  if (recording) { try { recog.stop(); } catch(e) {} recording = false; render(); return; }
  recog = new SR();
  recog.continuous = true;
  recog.interimResults = true;
  recog.lang = 'en-NG';
  let finalTxt = '';
  recog.onresult = function(e) {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalTxt += e.results[i][0].transcript + ' ';
      else interim += e.results[i][0].transcript;
    }
    const inp = document.getElementById('newItem');
    if (inp) inp.value = (finalTxt + interim).trim();
  };
  recog.onerror = function(e) {
    recording = false;
    const msgs = {
      'not-allowed': 'Microphone permission was blocked. Tap the lock/permission icon in your browser address bar and allow the mic, then try again.',
      'service-not-allowed': 'Speech service not allowed. Check browser permissions.',
      'no-speech': 'No speech detected. Try again and speak clearly.',
      'audio-capture': 'No microphone found. Check that a mic is connected.',
      'network': 'Speech service needs a network connection (Chrome sends audio to its servers).',
      'aborted': ''
    };
    setMicStatus(msgs[e.error] !== undefined ? msgs[e.error] : 'Voice error: ' + e.error, e.error !== 'aborted');
    render();
  };
  recog.onend = function() {
    recording = false;
    render();
    const inp2 = document.getElementById('newItem');
    if (inp2 && finalTxt.trim()) { inp2.value = finalTxt.trim(); inp2.focus(); }
    if (!micStatus) setMicStatus('', false);
  };
  try {
    recog.start();
    recording = true;
    setMicStatus('', false);
    render();
  } catch(err) {
    setMicStatus('Could not start the microphone: ' + err.message, true);
    render();
  }
}

/* ---- Nightly reminder (Notification API) ---- */
function summaryText() {
  const overdue = items.filter(i => i.cat !== 'done' && dlState(i.dl) === 'overdue').length;
  const dueToday = items.filter(i => i.cat !== 'done' && dlState(i.dl) === 'duetoday').length;
  const openToday = items.filter(i => i.cat === 'today').length;
  let parts = [];
  if (overdue) parts.push(overdue + ' overdue');
  if (dueToday) parts.push(dueToday + ' due today');
  parts.push(openToday + ' on Today');
  return parts.join(' · ');
}
function fireReminder() {
  const body = summaryText();
  lastRemindDate = todayStr();
  save(); render();
  if ('Notification' in window && Notification.permission === 'granted') {
    try { new Notification('Insight360 Tracker — evening check-in', { body: body }); } catch(e) {}
  }
  alert('Evening check-in: ' + body);
}
function checkReminder() {
  if (!remindEnabled) return;
  const now = new Date();
  const hhmm = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  if (hhmm >= remindTime && lastRemindDate !== todayStr()) fireReminder();
}
function toggleReminder() {
  if (!remindEnabled) {
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission().then(function() {
        remindEnabled = true; save(); render(); checkReminder();
      });
      return;
    }
    if ('Notification' in window && Notification.permission === 'denied') {
      alert('Notifications are blocked in this browser. Enable them in site settings to get the nightly reminder as a notification. The in-app reminder will still work.');
    }
    remindEnabled = true; save(); render(); checkReminder();
  } else {
    remindEnabled = false; save(); render();
  }
}
function setRemindTime(v) { if (v) { remindTime = v; save(); render(); } }
setInterval(checkReminder, 30000);

/* ---- Import / Export ---- */
function exportData() {
  const data = JSON.stringify({ items: items, customProjs: customProjs(), exportedAt: new Date().toISOString() }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'insight360-tracker-backup.json';
  a.click();
}
document.getElementById('importFile').addEventListener('change', function(e) {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = function() {
    try {
      const data = JSON.parse(reader.result);
      const arr = Array.isArray(data) ? data : data.items;
      if (!Array.isArray(arr) || !arr.every(i => i && typeof i.txt === 'string' && i.cat)) throw new Error('bad format');
      if (!confirm('Import ' + arr.length + ' tasks? This replaces your current list.')) return;
      items = arr.map((i, idx) => ({
        id: typeof i.id === 'number' ? i.id : idx + 1,
        cat: CATS.some(c => c.id === i.cat) ? i.cat : 'today',
        txt: i.txt,
        pri: PRI[i.pri] ? i.pri : 'p2',
        proj: i.proj || 'other',
        ...(i.dl ? { dl: i.dl } : {})
      }));
      if (data.customProjs) { Object.assign(PROJS, data.customProjs); PROJ_ORDER = Object.keys(PROJS); }
      nextId = items.reduce((m, i) => Math.max(m, i.id), 0) + 1;
      selected = {}; editingId = null;
      save(); render();
    } catch(err) {
      alert('Import failed: that file is not a valid tracker backup.');
    }
    e.target.value = '';
  };
  reader.readAsText(f);
});

document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && lastDeleted && !e.target.matches('input,select,textarea')) {
    e.preventDefault(); undoDelete();
  }
});

load();
render();
setTimeout(checkReminder, 3000);
</script>
</body>
</html>
